worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 6m;

  log_format json escape=json '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
                              '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,'
                              '"upstream":"$upstream_addr","ua":"$http_user_agent"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  # Docker DNS - lets optional upstreams (telegram webhook) be resolved lazily.
  resolver 127.0.0.11 valid=30s ipv6=off;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/csv image/svg+xml;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  include /etc/nginx/jobintel.d/*.conf;
}
